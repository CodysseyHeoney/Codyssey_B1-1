<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <!-- 평가: HTML·CSS·JavaScript를 파일별로 분리해 연결 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- 평가: 시맨틱 header와 nav로 페이지 상단·내비게이션 구성 -->
  <header>
    <nav aria-label="주요 메뉴">
      <div class="nav-brand">
        <a href="#hero">HeoNey</a>
        <!-- 평가: 다크 모드 전환 버튼에 aria-label(스크린리더가 읽을 수 있는 라벨) 추가 -->
        <button id="theme-toggle" type="button" aria-label="다크 모드로 전환">☾</button>
      </div>

      <!-- 평가: 각 section으로 이동하는 내비게이션 링크 -->
      <ul id="main-menu">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu" aria-label="메뉴 열기">☰</button>
    </nav>
  </header>

  <!-- 평가: 페이지의 주요 콘텐츠를 main 안에 구성 -->
  <main>
    <section id="hero">
      <div class="hero-content">
        <p>Hello, I am</p>
        <h1>YeonJin</h1>
        <p>초보개발자의 성장기</p>
      </div>

      <div class="hero-actions">
        <a href="#projects">View Projects</a>
        <a href="#contact">Contact Me</a>
      </div>
    </section>

    <section id="about" class="reveal">
      <h2>About Me</h2>

      <div>
        <img src="images/Cat2.png" alt="고양이 프로필 이미지">

        <div>
          <p>HeoNey_Jin</p>
          <p>웹 개발 공부중...</p>
        </div>
      </div>
    </section>

    <section id="skills" class="reveal">
      <h2>Skills</h2>

      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </section>

    <!-- 평가: 프로젝트 목록을 section으로 구분하고 API 카드 영역 제공 -->
    <section id="projects" class="reveal">
      <h2>Projects</h2>

      <div id="projects-container" aria-live="polite">
        <article class="project-card">
          <img class="project-image" src="images/whale.png" alt="작업실 꾸미기 프로젝트 이미지">
          <h3>작업실 꾸미기</h3>
          <p class="project-stars" aria-label="Stars 0개">☆</p>
          <a href="https://github.com/CodysseyHeoney/codyssey-mission1">
            View on GitHub
          </a>
        </article>

        <article class="project-card">
          <img class="project-image project-image--shortcake" src="images/shortcake.png" alt="나만의 퀴즈게임 프로젝트 이미지">
          <h3>나만의 퀴즈게임</h3>
          <p class="project-stars" aria-label="Stars 0개">☆</p>
          <a href="https://github.com/CodysseyHeoney/codyssey-mission2">
            View on GitHub
          </a>
        </article>
      </div>
    </section>

    <!-- 평가: 필수 입력값·이메일 형식 검사를 위한 contact form -->
    <section id="contact" class="reveal">
      <h2>Contact</h2>

      <form id="contact-form" novalidate>
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
          <small id="name-error"></small>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <small id="email-error"></small>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <small id="message-error"></small>
        </div>

        <button type="submit">Send Message</button>
        <p id="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <!-- 평가: 맨 위로 가기 버튼 동작 연결 -->
  <button id="scroll-top" type="button" aria-label="맨 위로 이동">
    ↑
  </button>

  <!-- 평가: 페이지 하단 정보를 시맨틱 footer로 구분 -->
  <footer>
    <p>&copy; 2026 HeoNey</p>
    <a href="https://github.com/CodysseyHeoney">View on GitHub</a>
  </footer>
</body>
</html>
